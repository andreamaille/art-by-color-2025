<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAFAF8; color: #141413; font-family: 'Schibsted Grotesk', Arial, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #DCDAD3">

    <button type="button" aria-label="Search the collection" style="width: 44px; height: 44px; border: 0; background: transparent; color: #141413; display: flex; align-items: center; justify-content: center">

    <button type="button" class="abc-pigment" aria-pressed="false" aria-label="Viridian, green" style="flex: none; width: 44px; height: 44px; justify-content: center"><span class="abc-pigment__dot" style="width: 34px; height: 34px; background: #2E7D63"></span></button>
    <button type="button" class="abc-pigment" aria-pressed="false" aria-label="Cobalt Teal, teal" style="flex: none; width: 44px; height: 44px; justify-content: center"><span class="abc-pigment__dot" style="width: 34px; height: 34px; background: #2A8E98"></span></button>

    <button type="button" class="abc-pigment" aria-pressed="false" aria-label="Dioxazine Violet, violet" style="flex: none; width: 44px; height: 44px; justify-content: center"><span class="abc-pigment__dot" style="width: 34px; height: 34px; background: #5B3A92"></span></button>
    <button type="button" class="abc-pigment" aria-pressed="false" aria-label="Quinacridone Rose, pink" style="flex: none; width: 44px; height: 44px; justify-content: center"><span class="abc-pigment__dot" style="width: 34px; height: 34px; background: #C94C7E"></span></button>
    <button type="button" class="abc-pigment" aria-pressed="false" aria-label="Burnt Sienna, brown" style="flex: none; width: 44px; height: 44px; justify-content: center"><span class="abc-pigment__dot" style="width: 34px; height: 34px; background: #8A4A2B"></span></button>

  <div style="padding: 20px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 28px">
      <a href="mobile-artwork.html" class="abc-card" style="gap: 8px">
        <img class="abc-card__img" src="../images/bluegreen.jpg" alt="Blue and Green Music by Georgia O'Keeffe">

        <span class="abc-card__meta" style="font-size: 12px">Georgia O'Keeffe, 1919/21</span>
      </a>
      <a href="mobile-artwork.html" class="abc-card" style="gap: 8px">
        <img class="abc-card__img" src="../images/pissarro.jpg" alt="Woman Mending by Camille Pissarro">
        <span aria-label="Palette" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: -4px"><span style="height: 24px; background: #858178"></span><span style="height: 24px; background: #6B6A6A"></span><span style="height: 24px; background: #C7C1B0"></span><span style="height: 24px; background: #4F4A4F"></span><span style="height: 24px; background: #AB9E8E"></span></span>
        <h2 class="abc-card__title" style="font-size: 17px">Woman Mending</h2>
        <span class="abc-card__meta" style="font-size: 12px">Camille Pissarro, 1895</span>
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 28px">
      <a href="mobile-artwork.html" class="abc-card" style="gap: 8px">
        <img class="abc-card__img" src="../images/machu.jpg" alt="Peru – Machu Picchu, Morning Light by Georgia O'Keeffe">
        <span aria-label="Palette" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: -4px"><span style="height: 24px; background: #809FCD"></span><span style="height: 24px; background: #2E5398"></span><span style="height: 24px; background: #13341F"></span><span style="height: 24px; background: #E9F4EA"></span><span style="height: 24px; background: #B5AD2C"></span></span>
        <h2 class="abc-card__title" style="font-size: 17px">Peru – Machu Picchu, Morning Light</h2>
        <span class="abc-card__meta" style="font-size: 12px">Georgia O'Keeffe, 1957</span>
      </a>
    </div>
  </div>

  <a href="mobile-gallery.html" class="abc-btn abc-btn--primary" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); min-height: 52px; padding: 0 28px; box-shadow: 0 12px 32px rgba(20,20,19,0.25)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
    Index
